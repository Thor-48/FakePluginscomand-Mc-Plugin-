# ==========================================================
#  FakePluginscomand - Configuration
#  After editing, run /fakeplugins reload
#  Messages use the MiniMessage format:
#  https://docs.advntr.dev/minimessage/format.html
# ==========================================================

settings:
  # Players with this permission see the real plugins and all commands.
  admin-permission: "fakeplugins.admin"

# ----------------------------------------------------------
#  Command tree (protection against client-side scanners)
#  Only applies to players WITHOUT the admin permission.
# ----------------------------------------------------------
command-tree:
  # Hides commands of this plugin (fakepluginscomand:...)
  hide-own-namespace: true
  # Hides ALL namespaced commands (essentials:home, luckperms:lp, ...)
  hide-namespaced-commands: true
  # Additional commands to hide from the command tree.
  hidden-commands:
    - plugins
    - pl
    - version
    - ver
    - about
    - bukkit:plugins
    - bukkit:pl
    - bukkit:version
    - bukkit:ver
    - bukkit:about

# ----------------------------------------------------------
#  Intercepted commands
# ----------------------------------------------------------
commands:
  # These commands show the plugin list (fake list for players).
  plugin-list-commands:
    - pl
    - plugins
    - bukkit:pl
    - bukkit:plugins
  # These commands always show the real plugins (admins only).
  real-list-commands:
    - rpl
    - realplugins
  # true  = admins see the real plugins when using /pl
  # false = admins see the fake list as well
  admins-see-real-plugins-on-list: true

# ----------------------------------------------------------
#  Display
# ----------------------------------------------------------
display:
  # true  = separate Paper and Bukkit plugin lists
  # false = one single list
  group-by-type: true
  # Show plugin info when hovering over a plugin name
  hover-info: true
  # Show plugin info in chat when clicking a plugin name
  click-info: true
  # Can everyone use /fakeplugininfo <plugin>?
  fake-info-command-enabled: true

# ----------------------------------------------------------
#  Messages
#  Placeholders: <count> <name> <version> <description>
#                <website> <authors>
# ----------------------------------------------------------
messages:
  # TIP: Set this to "" (empty) to make the admin commands look like they do
  # not exist. Players without permission then get the normal "Unknown command".
  no-permission: "<red>You do not have permission to use this command."
  usage-realplugininfo: "<red>Usage: /realplugininfo <plugin>"
  usage-reload: "<red>Usage: /fakeplugins reload"
  plugin-not-found: "<red>Plugin not found."
  reloaded: "<green>Configuration reloaded."

  list-header: "<blue>ℹ </blue><white>Server Plugins (<count>):"
  list-header-paper: "<blue>Paper Plugins (<count>):"
  list-header-bukkit: "<gold>Bukkit Plugins (<count>):"
  list-prefix: "<dark_gray> - "
  list-separator: "<dark_gray>, "
  list-plugin: "<green><name>"

  info-title: "<white><name> version <version>"
  info-description: "<white><description>"
  info-website: "<white>Website: <website>"
  info-authors: "<white>Authors: <authors>"

# ----------------------------------------------------------
#  Fake plugins
#  Add as many entries as you like. The order is the display order.
#  name          (required) Name shown in the list
#  version       Version string (keep it in quotes)
#  description   Description text
#  website       Optional. Leave empty ("") to hide the website line
#  authors       Authors as text
#  paper-plugin  true = listed under "Paper Plugins", false = "Bukkit Plugins"
# ----------------------------------------------------------
